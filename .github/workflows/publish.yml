# Publishes Graphyzo to Cloudflare Pages (https://graphyzo.pages.dev/) on every push to main.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (permission: Account > Cloudflare Pages > Edit)
# and CLOUDFLARE_ACCOUNT_ID.
name: Publish to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: publish
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect the site files
        run: mkdir site && cp index.html og.jpg site/
      - name: Create the Pages project the first time
        working-directory: site
        run: |
          if ! npx --yes wrangler@4.20.0 pages project list | grep -qw graphyzo; then
            npx --yes wrangler@4.20.0 pages project create graphyzo --production-branch main
          fi
      - name: Publish
        working-directory: site
        run: npx --yes wrangler@4.20.0 pages deploy . --project-name graphyzo --branch main --commit-dirty=true
